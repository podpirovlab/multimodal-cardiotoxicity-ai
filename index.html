<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioOncoPredict: Multimodal AI System</title>
    <!-- Официальное стабильное CDN-ядро Gradio-Lite -->
    <script type="module" src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #f8f9fa; }
        gradio-app { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

    <gradio-app theme_mode="light">
    <template type="code">
import gradio as gr
import numpy as np
import matplotlib.pyplot as plt

def predict_cardio_system(age, sex, chemo_status):
    fs = 250
    duration = 5
    t_axis = np.linspace(0, duration, fs * duration)
    is_damaged = (chemo_status == "Критическая кумулятивная доза Доксорубицина")
    
    def generate_single_pulse(t, is_sick):
        p = 0.12 * np.exp(-((t - 0.2) / 0.025)**2)
        q = -0.08 * np.exp(-((t - 0.28) / 0.01)**2)
        r = 1.35 * np.exp(-((t - 0.3) / 0.012)**2)
        s = -0.3 * np.exp(-((t - 0.33) / 0.012)**2)
        if is_sick:
            t_wave = 0.06 * np.exp(-((t - 0.52) / 0.08)**2)
        else:
            t_wave = 0.32 * np.exp(-((t - 0.52) / 0.045)**2)
        return p + q + r + s + t_wave

    raw_signal = np.zeros_like(t_axis)
    for beat in range(6):
        t_start = beat * 0.8
        t_idx = (t_axis >= t_start) & (t_axis < t_start + 0.8)
        if np.any(t_idx):
            raw_signal[t_idx] += generate_single_pulse(t_axis[t_idx] - t_start, is_damaged)
            
    fig, (ax1, ax2) = plt.subplots(2, 1, figsize=(11, 5.5))
    ax1.plot(t_axis[:750], raw_signal[:750], color='#1d3557', linewidth=1.5)
    ax1.set_title("1. Input Digital ECG Waveform (1D Modality)", fontweight='bold', fontsize=10)
    ax1.set_ylabel("Voltage (mV)")
    ax1.grid(True, linestyle=':', alpha=0.5)
    
    danger_zones = (t_axis % 0.8 > 0.45) & (t_axis % 0.8 < 0.65) if is_damaged else np.zeros_like(t_axis, dtype=bool)
    ax2.plot(t_axis[:750], raw_signal[:750], color='#1d3557', alpha=0.4)
    ax2.fill_between(t_axis[:750], -0.4, 1.4, where=danger_zones[:750], color='#e63946', alpha=0.3)
    ax2.set_title("2. Explainable AI Focus Map (ST-T Segment Anomalies)", fontweight='bold', fontsize=10)
    ax2.set_ylabel("Amplitude")
    ax2.set_ylim(-0.4, 1.4)
    ax2.grid(True, linestyle=':', alpha=0.5)
    plt.tight_layout()

    prob = 0.9342 if is_damaged else 0.1245
    risk_status = "CRITICAL RISK / FERROPTOSIS DETECTED" if prob > 0.5 else "STABLE / NORMAL MYOCARDIUM"
    
    clinical_report = f"=== CardioOncoPredict REPORT ===\nAge: {age} | Sex: {sex}\nRisk: {prob*100:.2f}%\nStatus: {risk_status}"
    return clinical_report, fig

demo = gr.Interface(
    fn=predict_cardio_system,
    inputs=[
        gr.Slider(18, 90, value=45, label="Patient Age"),
        gr.Radio(["Female", "Male"], value="Male", label="Patient Sex"),
        gr.Radio(["Baseline Pre-Check", "Критическая кумулятивная доза Доксорубицина"], 
                 value="Baseline Pre-Check", label="Chemotherapy Status")
    ],
    outputs=[
        gr.Textbox(label="AI AGENT REPORT", lines=5),
        gr.Plot(label="Electrophysiological Analytics (XAI)")
    ],
    title="🩺 CardioOncoPredict System",
    description="Decentralized Wasm Neural Engine running locally in browser."
)
demo.launch()
    </template>
    </gradio-app>

</body>
</html>
