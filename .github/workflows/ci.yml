name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Node runs the browser code in tests (JS/Python parity, EDF/BDF/CSV readers);
      # with CI set, those tests fail instead of skipping if Node is missing.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all Python sources (syntax / import sanity check)
        run: python -m compileall -q cardioonco legacy scripts app.py train_ptbxl.py predict.py

      - name: Tests (TWA maths, JS parity, file readers, entry points, training on fake PTB-XL)
        run: |
          pip install pytest
          python -m pytest -q tests

  # The Dockerfile cannot be checked by the tests above: build the image and run
  # one TWA analysis inside it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the lab image
        run: docker build -t cardioonco-lab .
      - name: Run one analysis inside the image
        run: docker run --rm cardioonco-lab python -c "import app; print(app.run_lab(20, 15, 75, 0.35)[0].splitlines()[0])"
