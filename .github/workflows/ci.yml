name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Node runs the browser code in tests (JS/Python parity, EDF/BDF/CSV readers);
      # with CI set, those tests fail instead of skipping if Node is missing.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all Python sources (syntax / import sanity check)
        run: python -m compileall -q cardioonco legacy scripts app.py train_ptbxl.py predict.py

      - name: Tests (TWA maths, JS parity, file readers, entry points, training on fake PTB-XL)
        run: |
          pip install pytest
          python -m pytest -q tests
